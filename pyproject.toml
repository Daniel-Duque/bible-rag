[project]
name = "bible-rag"
version = "0.1.0"
description = "Bilingual (KJV / Reina-Valera 1960) Bible RAG service, queryable from the terminal or over HTTP."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    # Retrieval: same embedding model + FAISS as RAG0.ipynb, without the LangChain wrappers
    "faiss-cpu>=1.8",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "pypdfium2>=4.30",
    # Offline embedding fallback: Google USE-multilingual v3 weights bundled in the wheel
    # (pure numpy, Apache-2.0). Used when the Hugging Face embedder cannot be downloaded.
    "fast-universal-sentence-encoder>=0.2.1",
    # Generation: same local LLM as the notebook (Qwen2.5-1.5B-Instruct)
    "torch>=2.2",
    "transformers>=4.56",
    "accelerate>=0.34",  # required by transformers to load GGUF files
    "gguf>=0.10",  # GGUF reader, for the bundled fallback LLM
    # Service / CLI
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
bible-rag = "bible_rag.cli:main"

[dependency-groups]
# Offline fallback LLM: SmolLM2-135M-Instruct (Q4_1 GGUF, Apache-2.0) shipped inside the
# `llm-smollm2` wheel by Simon Willison. Only the .gguf file is used, loaded with transformers;
# the package's own runtime deps (the `llm` CLI and llama-cpp-python, which needs a C++ build)
# are neutralised below.
fallback-llm = ["llm-smollm2==0.1.2"]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "ipykernel>=6",
]

[tool.uv]
default-groups = ["dev", "fallback-llm"]
override-dependencies = [
    "llama-cpp-python; sys_platform == 'never'",
    "llm; sys_platform == 'never'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bible_rag"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.ipynb", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
    "pdf: parses the real Bible PDFs (~20 s)",
    "hf: runs the real transformers / sentence-transformers code paths on tiny local models",
]
