[project]
name = "bible-rag"
version = "0.1.0"
description = "Bilingual (KJV / Reina-Valera 1960) Bible RAG: terminal and web chat."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "faiss-cpu>=1.8", # vector search (as in RAG0.ipynb)
    "sentence-transformers>=3.0", # preferred embedder (MiniLM multilingual)
    "fast-universal-sentence-encoder>=0.2.1", # offline embedder, weights in the wheel
    "numpy>=1.26",
    "pypdfium2>=4.30", # PDF text
    "torch>=2.2",
    "transformers>=4.56", # preferred LLM (Qwen2.5-1.5B-Instruct)
    "accelerate>=0.34", # + gguf: load the bundled GGUF fallback
    "gguf>=0.10",
    "httpx>=0.27", # Ollama / OpenAI-compatible servers
    "python-dotenv>=1.0",
    "streamlit>=1.40", # web chat (app.py)
    "pysword>=0.2.8",
]

[project.scripts]
bible-rag = "bible_rag.cli:main"

[dependency-groups]
# Offline fallback LLM: SmolLM2-135M-Instruct GGUF inside the `llm-smollm2` wheel (Simon
# Willison, Apache-2.0). Only the .gguf is used; the package's runtime deps (the `llm` CLI and
# llama-cpp-python, a C++ build) are disabled by the overrides below.
fallback-llm = ["llm-smollm2==0.1.2"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
default-groups = ["dev", "fallback-llm"]
override-dependencies = [
    "llama-cpp-python; sys_platform == 'never'",
    "llm; sys_platform == 'never'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bible_rag"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.ipynb", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM905"]  # word lists written as split strings

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "pdf: parses the real RVR1960 PDF (~50 s)",
    "sword: reads the real public-domain SWORD modules (downloads them once from Debian)",
    "hf: real transformers / sentence-transformers code on tiny local models + bundled SmolLM2",
]
