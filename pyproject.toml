[project]
name = "bible-rag"
version = "0.1.0"
description = "Bilingual (KJV / Reina-Valera 1960) Bible RAG service, queryable from the terminal or over HTTP."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    # Retrieval: same embedding model + FAISS as RAG0.ipynb, without the LangChain wrappers
    "faiss-cpu>=1.8",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "pypdfium2>=4.30",
    # Generation: same local LLM as the notebook (Qwen2.5-1.5B-Instruct)
    "torch>=2.2",
    "transformers>=4.56",
    # Service / CLI
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
bible-rag = "bible_rag.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "ipykernel>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bible_rag"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.ipynb", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
    "pdf: parses the real Bible PDFs (~20 s)",
    "hf: runs the real transformers / sentence-transformers code paths on tiny local models",
]
