[project]
name = "bible-rag"
version = "0.1.0"
description = "A Bible assistant that answers questions, weighs apparent contradictions and compares translations, with the Hebrew and Greek originals and checked citations."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "fast-universal-sentence-encoder>=0.2.1", # default embedder (usem3), weights in the wheel
    "sentence-transformers>=3.0", # optional embedders (BIBLE_RAG_EMBEDDING_MODEL)
    "numpy>=1.26",
    "pypdfium2>=4.30", # RVR1960 PDF text
    "torch>=2.2",
    "transformers>=4.56", # default LLM (Qwen2.5-1.5B-Instruct), NLI model
    "accelerate>=0.34", # + gguf: load the bundled GGUF fallback
    "gguf>=0.10",
    "httpx>=0.27", # Ollama / OpenAI-compatible servers
    "python-dotenv>=1.0",
    "streamlit>=1.40", # web chat (app.py)
    "fastapi>=0.110", # `bible-rag serve`: the read-only API for a GPU machine
    "uvicorn>=0.29",
    "pysword>=0.2.8", # reads the SWORD Bible modules
]

[project.scripts]
bible-rag = "bible_rag.cli:main"

[dependency-groups]
# Offline fallback LLM: SmolLM2-135M-Instruct GGUF inside the `llm-smollm2` wheel (Simon
# Willison, Apache-2.0). Only the .gguf is used; the package's runtime deps (the `llm` CLI and
# llama-cpp-python, a C++ build) are disabled by the overrides below.
fallback-llm = ["llm-smollm2==0.1.2"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
default-groups = ["dev", "fallback-llm"]
override-dependencies = [
    "llama-cpp-python; sys_platform == 'never'",
    "llm; sys_platform == 'never'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bible_rag"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM905"]  # word lists written as split strings

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "pdf: parses the real RVR1960 PDF (~50 s; skipped without it)",
    "sword: reads the real public-domain SWORD modules (downloads them once from Debian)",
    "hf: real transformers / sentence-transformers code on tiny local models + bundled SmolLM2",
]
filterwarnings = [
    # FastAPI's test client, a test-only dependency
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
